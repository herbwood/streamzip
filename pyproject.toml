[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "streamzip"
version = "0.1.0"
description = "Budget-conditioned post-training for streaming video language models"
requires-python = ">=3.12"
dynamic = ["dependencies"]

[tool.setuptools]
packages = ["streamzip"]

[tool.setuptools.dynamic]
dependencies = {file = ["requirements.txt"]}
