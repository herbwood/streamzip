model:
  name_or_path: Qwen/Qwen3-VL-8B-Instruct
  native_checkpoint: models/qwen3-vl-native
  adapter_checkpoint: outputs/train/adapter
  local_files_only: true

streamzip:
  chunk_seconds: 8
  budgets: [1.0, 0.5, 0.25, 0.125]
  minimum_current_tokens: 8

lora:
  rank: 8
  alpha: 16
  dropout: 0
  top_layers: 8

loss:
  margin_weight: 0.5
  margin: 0.2
  distill_weight: 0.3
  temperature: 1.0

runtime:
  tensor_parallel_size: 2
  data_parallel_size: 1
  master_port: 29500

evaluation:
  output_dir: outputs/evaluation
